name: Daily Land Scrape

on:
  schedule:
    - cron: '0 13 * * *'  # 6 AM AZ time (13:00 UTC)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Create data directory
        run: mkdir -p data

      - name: Run scraper
        env:
          DISCORD_WEBHOOK_URL_LAND: ${{ secrets.DISCORD_WEBHOOK_URL_LAND }}
        run: python main.py
